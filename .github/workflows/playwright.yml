name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check site reachability
        run: bash .claude/hooks/pre-test.sh
        continue-on-error: true

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: true

      - name: Run navigation tests
        run: npm run test:navigation
        env:
          CI: true
        if: success()

      - name: Run forms tests
        run: npm run test:forms
        env:
          CI: true
        if: success()

      - name: Run functional tests
        run: npx playwright test tests/functional/ --project=chromium-desktop
        env:
          CI: true
        if: success()

      - name: Run responsive tests
        run: npm run test:responsive
        env:
          CI: true
        if: success()

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
